[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-deployment-harness"
version = "0.1.0"
description = "文件系统优先、受策略门禁控制的模型部署 Harness"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21,<5",
  "paramiko>=3.4,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"

[tool.setuptools]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
