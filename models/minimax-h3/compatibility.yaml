preflight_requirements:
  - 用户精确指定的 GPU ID 存在且未被占用
  - 已记录拓扑与对等访问情况
  - 目标任务、分辨率、时长和参考输入范围符合有证据支持的配置
  - 主机内存以及模型、缓存、临时和输出磁盘分别具有充足余量
  - 驱动与 CUDA 兼容性匹配已固定版本的框架运行时
  - 框架 commit 或容器摘要不可变，且可证明具备 H3 能力

unsupported_in_mvp:
  - AMD 或 ROCm 目标
  - 将已列配置外推到不同 GPU 或互连方式
  - 未经单独审核 Recipe 的跨节点部署
